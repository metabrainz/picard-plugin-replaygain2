"manifest.description" = "为音轨和专辑计算 ReplayGain 信息"
"manifest.long_description" = "根据 [ReplayGain 2.0 规范](https://wiki.hydrogenaud.io/index.php?title=ReplayGain_2.0_specification). 为音轨和专辑计算 ReplayGain 信息\n此插件依赖于 ReplayGain 工具 [rsgain](https://github.com/complexlogic/rsgain). 用户必须在使用前安装 rsgain 并在插件设置中设置其路径。\n\n#### 使用方法\n选择一个或多个音轨、专辑或聚类，然后右键单击并选择 Plugin->Calculate ReplayGain.\n插件将为选定项目计算 ReplayGain 信息，并在元数据窗口中显示结果。单击保存按钮将标签写入文件。\n\n支持的文件格式：\n\n- MP3 (.mp3)\n- FLAC (.flac)\n- Ogg (.ogg, .oga, spx)\n- Opus (.opus)\n- MPEG-4 Audio (.m4a, .mp4)\n- Wavpack (.wv)\n- Monkey's Audio (.ape)\n- WMA (.wma)\n- MP2 (.mp2)\n- WAV (.wav)\n- AIFF (.aiff)\n- TAK (.tak)\n- MusePack *(仅限流媒体版本 8)* (.mpc)\n\n此插件基于 Philipp Wolfer 和 Sophist 的原始 ReplayGain 插件。\n"
"manifest.name" = "ReplayGain 2.0"
